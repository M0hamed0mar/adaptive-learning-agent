[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
markers =
    llm: tests that call the real LLM (excluded from default runs)
filterwarnings =
    ignore::DeprecationWarning
