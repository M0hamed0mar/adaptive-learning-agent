# ============================================================
# Local Docker Compose stack for Adaptive Learning Agent.
#
# Usage:
#   docker compose up --build     # build and run
#   docker compose down           # stop and remove
#   docker compose logs -f app    # tail logs
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adaptive-learning-agent:latest
    container_name: adaptive-learning-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/adaptive_learning.db}
      PORT: 8000
    volumes:
      # Persist the SQLite database across container restarts.
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
    driver: local
